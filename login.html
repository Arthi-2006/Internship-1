
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlogSpace</title>
    <link rel="stylesheet" href="style2.css">
    <script src="auth.js" defer></script>
</head>
<body class="auth-page">

    <header>
        <h1>BlogSpace</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-container">
        <form class="auth-card" id="loginForm" novalidate>
            <h2>Welcome Back!</h2>
            <p>Login to continue to BlogSpace.</p>

            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>
            <small class="error" id="loginEmailError"></small>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter your password" required>
            <small class="error" id="loginPasswordError"></small>

            <button type="submit">Login</button>

            <p id="loginMessage" class="message" role="status"></p>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </form>
    </main>

</body>
</html>
